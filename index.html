<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NPC Backlog & Capacity Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 24px;
      color: #0f172a;
    }
    h1 { margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
    .card h3 {
      margin-top: 0;
      font-size: 14px;
      color: #475569;
    }
    .kpi {
      font-size: 26px;
      font-weight: bold;
    }
    label {
      font-size: 12px;
      display: block;
      margin-top: 8px;
    }
    input, select {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }
    .pos { color: #16a34a; font-weight: bold; }
    .neg { color: #dc2626; font-weight: bold; }
  </style>
</head>

<body>

<h1>NPC Backlog & Capacity Dashboard</h1>

<!-- KPIs -->
<div class="grid">
  <div class="card">
    <h3>Current Backlog</h3>
    <div class="kpi" id="currentBacklogKpi">0</div>
  </div>
  <div class="card">
    <h3>Monthly Capacity</h3>
    <div class="kpi" id="capacityKpi">0</div>
  </div>
  <div class="card">
    <h3>Additional QA FTE Needed</h3>
    <div class="kpi" id="addlQaTop">0</div>
  </div>
  <div class="card">
    <h3>Additional Dev FTE Needed</h3>
    <div class="kpi" id="addlDevTop">0</div>
  </div>
</div>

<br>

<!-- INPUTS -->
<div class="grid">
  <div class="card">
    <h3>Backlog</h3>
    <label>Current Backlog</label>
    <input id="currentBacklog" type="number" value="545">
  </div>

  <div class="card">
    <h3>Monthly Inflow</h3>
    <label>NPC</label>
    <input id="npcMonthly" type="number" value="110">
    <label>Prospect</label>
    <input id="prospectMonthly" type="number" value="67">
  </div>

  <div class="card">
    <h3>Capacity Mode</h3>
    <label>Mode</label>
    <select id="capacityMode">
      <option value="auto">Auto (from Dev & QA)</option>
      <option value="manual">Manual Override</option>
    </select>

    <label>Manual Capacity</label>
    <input id="manualCapacity" type="number" value="225" disabled>
  </div>

  <div class="card">
    <h3>Engineering</h3>
    <label>Dev FTE</label>
    <input id="devFte" type="number" value="8">
    <label>QA FTE</label>
    <input id="qaFte" type="number" value="7">
  </div>
</div>

<br>

<!-- CHART -->
<div class="card">
  <h3>6-Month Incremental Backlog Forecast</h3>
  <canvas id="forecastChart" height="120"></canvas>
</div>

<script>
  const months = ["Jan","Feb","Mar","Apr","May","Jun"];
  const DEV_HRS = 8.9, QA_HRS = 7.8, HRS = 160;

  const chart = new Chart(document.getElementById("forecastChart"), {
    type: "line",
    data: {
      labels: months,
      datasets: [
        {
          label: "Backlog",
          data: [],
          borderColor: "#0f172a",
          tension: 0.2,
          datalabels: { align: "top", anchor: "end" }
        },
        {
          label: "Capacity",
          data: [],
          borderColor: "#16a34a",
          borderDash: [6,4],
          datalabels: { align: "bottom", anchor: "end" }
        }
      ]
    },
    options: {
      plugins: { legend: { position: "top" }, datalabels: { clamp: true } },
      scales: { y: { beginAtZero: true } }
    },
    plugins: [ChartDataLabels]
  });

  function recalc() {
    const backlog = +currentBacklog.value;
    const inflow = +npcMonthly.value + +prospectMonthly.value;

    const devCap = Math.floor((+devFte.value * HRS) / DEV_HRS);
    const qaCap  = Math.floor((+qaFte.value * HRS) / QA_HRS);

    let capacity;
    if (capacityMode.value === "manual") {
      capacity = +manualCapacity.value;
      manualCapacity.disabled = false;
    } else {
      capacity = Math.min(devCap, qaCap);
      manualCapacity.disabled = true;
      manualCapacity.value = capacity;
    }

    // KPIs
    currentBacklogKpi.textContent = backlog;
    capacityKpi.textContent = capacity;

    // Forecast
    let b = backlog;
    const bArr=[], cArr=[];
    for (let i=0;i<6;i++){
      bArr.push(b);
      cArr.push(capacity);
      b = Math.max(0, b + inflow - capacity);
    }

    chart.data.datasets[0].data = bArr;
    chart.data.datasets[1].data = cArr;
    chart.update();

    // Additional FTE
    const gap = inflow - capacity;
    addlDevTop.textContent = gap > 0 ? Math.ceil((gap * DEV_HRS) / HRS) : 0;
    addlQaTop.textContent  = gap > 0 ? Math.ceil((gap * QA_HRS) / HRS) : 0;
  }

  document.querySelectorAll("input, select").forEach(i =>
    i.addEventListener("input", recalc)
  );
  recalc();
</script>

</body>
</html>
